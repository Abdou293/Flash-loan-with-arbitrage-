[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
# Must match the target chain. Arbitrum One supports Cancun opcodes (PUSH0, MCOPY, TSTORE...).
# With an older value, fork tests fail inside Aave/Uniswap code with "EvmError: NotActivated".
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256
